name: Build Desktop Packages

# Produces the native distribution artifacts from GDD §1:
#   - Windows  .zip  (contains MonsterColiseumBrawl.exe + runtime)
#   - macOS    .zip  (universal MonsterColiseumBrawl.app, arm64 + x86_64)
#   - Linux    .zip  (proof/pipeline + Linux play)
#
# Each OS builds its own package on a native runner (electron-builder cannot
# cross-compile a mac .app from Linux, nor sign it). Artifacts are uploaded so
# you can download, extract, and double-click to reach the lobby.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed so tagged builds can publish Release assets (direct download links)

jobs:
  test:
    name: Headless data/rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Linux intentionally dropped — Windows + macOS only (per request).
        include:
          - os: windows-latest
            target: dist:win
            artifact: windows-zip
          - os: macos-latest
            target: dist:mac
            artifact: macos-universal-zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package
        run: npm run ${{ matrix.target }}
        env:
          # Unsigned builds for the prototype. macOS users right-click → Open to
          # authorize the first launch (GDD-mentioned "authorize on Mac" step).
          # NOTE: deliberately NO GH_TOKEN here — otherwise electron-builder also
          # tries to auto-publish a release, racing the dedicated release job.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Guard: electron-builder 25.x can exit non-zero on a vestigial post-zip
      # step (blockmap) on recent macOS runners even though the .zip is fully
      # written. differentialPackage:false removes that step; this verifies the
      # artifact actually exists so a real failure still fails the job.
      - name: Verify artifact exists
        shell: bash
        run: |
          count=$(ls release/*.zip 2>/dev/null | wc -l)
          echo "Found $count .zip artifact(s):"
          ls -lh release/*.zip
          test "$count" -ge 1

      - name: Upload CI artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: MonsterColiseumBrawl-${{ matrix.artifact }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  # Single release job runs AFTER all three builds succeed, collects their
  # artifacts, and publishes the Release exactly once (no parallel-create race).
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect .zip files
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          ls -lh release/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: true
          name: Monster Coliseum Brawl ${{ github.ref_name }}
          body: |
            Prototype desktop builds for **${{ github.ref_name }}**.

            ### Direct downloads
            - **Windows:** `MonsterColiseumBrawl-*-win-x64.zip` — extract, double-click `MonsterColiseumBrawl.exe`.
            - **macOS (universal):** `MonsterColiseumBrawl-*-mac-universal.zip` — extract, then right-click the `.app` → **Open** to authorize (unsigned prototype build).
            - **Linux:** `MonsterColiseumBrawl-*-linux-x64.zip`.

            > ⚠️ Unsigned prototype. Builds are verified to compile/package in CI; launch-testing on real hardware is recommended.
